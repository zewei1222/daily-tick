<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>極簡待辦</title>
<meta name="description" content="極簡重複待辦清單">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Todo">
<link rel="manifest" href="/daily-tick/manifest.json">
<link rel="apple-touch-icon" href="/daily-tick/icons/icon-180.png">
<link rel="icon" href="/daily-tick/icons/icon-192.png">

<!-- 開機圖：避免 standalone 冷啟動白閃（SPEC §7.4）。
     目前涵蓋 iPhone 15 Pro（393x852 @3x）；新增機型只要再加一行 link。 -->
<link rel="apple-touch-startup-image"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/daily-tick/splash/splash-1179x2556.png">

<link rel="stylesheet" href="/daily-tick/css/tokens.css">
<link rel="stylesheet" href="/daily-tick/css/app.css">
</head>
<body>

<header class="app-head">
  <button class="btn-text head-l" id="btn-edit" type="button">編輯</button>
  <h1 class="app-title" id="app-title">每日</h1>
  <button class="btn-icon head-r" id="btn-settings" type="button" aria-label="設定">
    ⚙<span class="sync-dot" id="sync-dot" hidden></span>
  </button>
</header>

<main class="app-main">

  <section class="view" id="view-daily" data-type="daily">
    <div class="view-inner">
      <ul class="list" id="list-daily"></ul>
      <p class="empty" id="empty-daily" hidden>還沒有每日任務。<br>按右下角的 ＋ 新增。</p>
    </div>
  </section>

  <section class="view" id="view-general" data-type="general" hidden>
    <div class="view-inner">
      <ul class="list" id="list-general"></ul>
      <p class="empty" id="empty-general" hidden>還沒有一般任務。<br>按右下角的 ＋ 新增。</p>
      <div class="list-foot" id="foot-general" hidden>
        <button class="btn is-block" id="btn-clear-done" type="button">清除已完成</button>
      </div>
    </div>
  </section>

  <section class="view" id="view-stats" hidden>
    <div class="view-inner" id="stats-body"></div>
  </section>

</main>

<button class="fab" id="fab" type="button" aria-label="新增任務">＋</button>

<nav class="tab-bar" role="tablist">
  <button class="tab" role="tab" data-tab="daily" aria-selected="true" type="button">每日</button>
  <button class="tab" role="tab" data-tab="general" aria-selected="false" type="button">一般</button>
  <button class="tab" role="tab" data-tab="stats" aria-selected="false" type="button">統計</button>
</nav>

<!-- 新增 / 編輯任務 -->
<div class="sheet is-fade" id="sheet-task" hidden role="dialog" aria-modal="true">
  <div class="sheet-head">
    <button class="btn-text head-l" data-act="cancel" type="button">取消</button>
    <span class="sheet-title" id="sheet-task-title">新增任務</span>
    <button class="btn-text head-r" data-act="save" type="button">儲存</button>
  </div>
  <div class="sheet-body">
    <div class="sheet-inner">
      <div class="field" id="field-type">
        <span class="label">類型</span>
        <div class="seg" id="seg-type">
          <button type="button" data-type="daily" aria-pressed="true">每日</button>
          <button type="button" data-type="general" aria-pressed="false">一般</button>
        </div>
      </div>
      <div class="field">
        <label class="label" for="input-title">任務名稱</label>
        <input class="input" id="input-title" type="text" maxlength="80"
               autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
      </div>
    </div>
  </div>
</div>

<!-- 設定 -->
<div class="sheet" id="sheet-settings" hidden role="dialog" aria-modal="true">
  <div class="sheet-head">
    <button class="btn-text head-l" data-act="close" type="button">返回</button>
    <span class="sheet-title">設定</span>
    <span class="head-r"></span>
  </div>
  <div class="sheet-body">
    <div class="sheet-inner">

      <div class="field">
        <label class="label" for="input-reset-hour">每日重置時間</label>
        <select class="input" id="input-reset-hour"></select>
        <p class="hint">每天到這個時間，每日任務才算換新的一天。已記錄的歷史不會因為改設定而變動。</p>
      </div>

      <div class="field">
        <span class="label">備份狀態</span>
        <p class="status-line">
          <span class="status-value" id="sync-status">未設定備份</span>
        </p>
        <p class="hint" id="sync-detail"></p>
        <div class="btn-row is-spaced">
          <button class="btn" id="btn-sync-now" type="button">立即同步</button>
        </div>
      </div>

      <div class="field">
        <label class="label" for="input-pat">GitHub PAT（scope 含 gist）</label>
        <input class="input" id="input-pat" type="password" autocomplete="off"
               autocapitalize="none" spellcheck="false" placeholder="ghp_...">
        <div class="btn-row is-spaced">
          <button class="btn is-primary" id="btn-pat-save" type="button">儲存並同步</button>
          <button class="btn is-danger" id="btn-pat-clear" type="button">移除</button>
        </div>
        <p class="hint">Token 只存在這台裝置，不會寫進備份或匯出檔。</p>
      </div>

      <div class="field">
        <span class="label">匯出</span>
        <textarea class="input" id="ta-export" readonly rows="4"></textarea>
        <div class="btn-row is-spaced">
          <button class="btn" id="btn-export-copy" type="button">複製</button>
        </div>
      </div>

      <div class="field">
        <label class="label" for="ta-import">匯入（會覆蓋現有資料）</label>
        <textarea class="input" id="ta-import" rows="4" autocapitalize="none" spellcheck="false"></textarea>
        <div class="btn-row is-spaced">
          <button class="btn is-danger" id="btn-import" type="button">匯入並覆蓋</button>
        </div>
      </div>

      <p class="hint" id="about-line"></p>

    </div>
  </div>
</div>

<div class="update-bar" id="update-bar" hidden>
  <span>有新版本</span>
  <button id="btn-reload" type="button">重新載入</button>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/daily-tick/js/util.js"></script>
<script src="/daily-tick/js/store.js"></script>
<script src="/daily-tick/js/model.js"></script>
<script src="/daily-tick/js/sync.js"></script>
<script src="/daily-tick/js/render.js"></script>
<script src="/daily-tick/js/gestures.js"></script>
<script src="/daily-tick/js/main.js"></script>
</body>
</html>
